<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SplitSquad</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;family=Inter:wght@400..700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#5d5f5f",
                        "surface-tint": "#785a00",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f1f1f1",
                        "outline-variant": "#d3c5ad",
                        "inverse-surface": "#2f3131",
                        "surface-bright": "#f9f9f9",
                        "on-primary-fixed-variant": "#5b4300",
                        "primary": "#785a00",
                        "tertiary-container": "#c4c5c5",
                        "surface-container-highest": "#e2e2e2",
                        "primary-container": "#f4bd31",
                        "on-primary-fixed": "#251a00",
                        "on-primary-container": "#694d00",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "on-tertiary-container": "#505252",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#817661",
                        "inverse-primary": "#f5be32",
                        "on-secondary-fixed-variant": "#474747",
                        "secondary": "#5e5e5e",
                        "surface-dim": "#dadada",
                        "secondary-fixed": "#e2e2e2",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#1b1b1b",
                        "surface-container-high": "#e8e8e8",
                        "tertiary-fixed": "#e2e2e2",
                        "surface-variant": "#e2e2e2",
                        "surface-container-low": "#f4f3f3",
                        "secondary-container": "#e2e2e2",
                        "on-surface": "#1a1c1c",
                        "secondary-fixed-dim": "#c6c6c6",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#1a1c1c",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#f5be32",
                        "surface": "#f9f9f9",
                        "on-secondary": "#ffffff",
                        "on-background": "#1a1c1c",
                        "on-tertiary-fixed-variant": "#454747",
                        "on-surface-variant": "#4f4634",
                        "error": "#ba1a1a",
                        "background": "#f9f9f9",
                        "surface-container": "#eeeeee",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#ffdf9d",
                        "on-secondary-container": "#646464"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "border-width-thin": "1px",
                        "margin-desktop": "32px",
                        "border-width-thick": "3px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Pixelify Sans", "sans-serif"],
                        "body-md": ["Inter"],
                        "label-sm": ["Space Mono"],
                        "label-md": ["Space Mono"],

                        "headline-md": ["Pixelify Sans", "sans-serif"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["40px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "1.0", "fontWeight": "500"}],
                        "label-md": ["14px", {"lineHeight": "1.0", "fontWeight": "500"}],
                        "headline-lg-mobile": ["32px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]

                }
            }
        }
    </script>
<style>
        .brutalist-border { border: 3px solid #1a1c1c; }
        .brutalist-border-thin { border: 1px solid #1a1c1c; }
        .brutalist-shadow { box-shadow: 4px 4px 0px #1a1c1c; }
        .brutalist-shadow-sm { box-shadow: 2px 2px 0px #1a1c1c; }
        .brutalist-shadow:active { box-shadow: none; transform: translate(4px, 4px); }
        body { background-color: #f9f9f9; color: #1a1c1c; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md bg-background min-h-screen flex flex-col pt-16 pb-20 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 bg-primary dark:bg-primary text-on-primary dark:text-on-primary border-b-[3px] border-on-surface">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-headline-md text-headline-md-mobile text-headline-md tracking-tighter text-on-primary uppercase">SplitSquad</span>
</div>
<button class="hover:bg-primary-container hover:text-on-primary-container p-2 brutalist-border-thin rounded-none transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<main class="flex-1 max-w-3xl w-full mx-auto p-margin-mobile md:p-margin-desktop space-y-6">
<!-- Scan & Manage Row -->
<div class="grid grid-cols-2 gap-gutter">
<button class="brutalist-border brutalist-shadow bg-primary-container p-4 flex flex-col items-center justify-center gap-2 hover:bg-inverse-primary transition-all active:translate-x-[4px] active:translate-y-[4px] active:shadow-none">
<span class="material-symbols-outlined text-4xl" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-label-md text-label-md uppercase text-center">Scan UPI<br/>QR Code</span>
</button>
<button class="brutalist-border brutalist-shadow bg-surface-container p-4 flex flex-col items-center justify-center gap-2 hover:bg-surface-variant transition-all active:translate-x-[4px] active:translate-y-[4px] active:shadow-none">
<span class="material-symbols-outlined text-4xl" data-icon="group_add">group_add</span>
<span class="font-label-md text-label-md uppercase text-center">Manage<br/>Participants</span>
</button>
</div>
<!-- Create Split Card -->
<div class="brutalist-border bg-surface p-6 space-y-6">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile uppercase border-b border-on-surface pb-2">Create Split</h2>
<div class="space-y-4">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md uppercase">Split Name</label>
<input class="w-full bg-surface-container-lowest brutalist-border-thin p-3 font-body-md focus:outline-none focus:border-[3px] focus:border-primary transition-all rounded-none" placeholder="Dinner, Cab, etc." type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md uppercase">Total Amount (₹)</label>
<input class="w-full bg-surface-container-lowest brutalist-border-thin p-3 font-headline-md focus:outline-none focus:border-[3px] focus:border-primary transition-all rounded-none" placeholder="0.00" type="number"/>
</div>
<!-- Segmented Control -->
<div class="flex brutalist-border bg-surface-container-low">
<button class="flex-1 p-3 font-label-sm text-label-sm uppercase bg-primary-container brutalist-border-thin border-r-0 hover:bg-inverse-primary active:bg-primary-container transition-colors">I Paid</button>
<button class="flex-1 p-3 font-label-sm text-label-sm uppercase bg-surface-container-lowest brutalist-border-thin hover:bg-surface-variant transition-colors text-on-surface-variant">Pay Merchant</button>
</div>
<!-- Add Participants Placeholder -->
<div class="border-2 border-dashed border-on-surface bg-surface-container-low p-6 flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="person_add">person_add</span>
<span class="font-label-md text-label-md uppercase text-center text-on-surface-variant">Add Participants</span>
</div>
<button class="w-full brutalist-border brutalist-shadow bg-primary-container p-4 font-label-md text-label-md uppercase text-on-primary-fixed hover:bg-inverse-primary transition-all active:translate-x-[4px] active:translate-y-[4px] active:shadow-none flex justify-center items-center gap-2">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                    Create Split
                </button>
</div>
</div>
<!-- Recent Splits -->
<div class="space-y-4 pt-4">
<h2 class="font-headline-md text-headline-md uppercase">Recent Splits</h2>
<div class="brutalist-border-thin p-8 flex flex-col items-center justify-center bg-surface-container-lowest text-center gap-4">
<span class="material-symbols-outlined text-4xl text-outline" data-icon="receipt_long">receipt_long</span>
<p class="font-body-md text-body-md text-on-surface-variant">No splits yet. Scan a QR or create one!</p>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 bg-surface px-2 border-t-[3px] border-on-surface">
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container border-[2px] border-on-surface shadow-[2px_2px_0px_#1a1c1c] scale-105 p-1 min-w-[64px]" href="#">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill">home</span>
<span class="font-label-sm text-label-sm uppercase mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant grayscale hover:bg-surface-container-high p-2 min-w-[64px]" href="#">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-label-sm text-label-sm uppercase mt-1">Scanner</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant grayscale hover:bg-surface-container-high p-2 min-w-[64px]" href="#">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="font-label-sm text-label-sm uppercase mt-1">Squad</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant grayscale hover:bg-surface-container-high p-2 min-w-[64px]" href="#">
<span class="material-symbols-outlined" data-icon="chat">chat</span>
<span class="font-label-sm text-label-sm uppercase mt-1">WhatsApp</span>
</a>
</nav>
</body></html>
